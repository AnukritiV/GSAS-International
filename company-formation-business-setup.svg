  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7931e"/><stop offset="1" stop-color="#f36b21"/></linearGradient>
</defs>
<rect width="900" height="700" fill="url(#bg)"/>
<circle cx="735" cy="125" r="165" fill="#ffffff" opacity=".045"/>
<circle cx="115" cy="565" r="220" fill="#ffffff" opacity=".035"/>
